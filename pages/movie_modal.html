<template id="movie-modal-template">
    <div class="movie-modal" id="movie-modal" role="dialog" aria-modal="true"
         aria-labelledby="modal-title" aria-describedby="modal-overview" hidden>
        <div class="movie-modal__backdrop" data-close-modal></div>

        <section class="movie-modal__panel" tabindex="-1">
            <button class="movie-modal__close" type="button"
                    aria-label="Close movie details" data-close-modal>&times;</button>

            <div class="movie-modal__hero" id="modal-hero">
                <div class="movie-modal__hero-shade"></div>
                <div class="movie-modal__hero-content">
                    <p class="movie-modal__eyebrow"><span class="movie-modal__eyebrow-mark"></span> CINEMATIX • MOVIE SPOTLIGHT</p>
                    <h2 id="modal-title">Loading movie...</h2>
                    <p id="modal-tagline" class="movie-modal__tagline" hidden></p>
                    <div id="modal-meta" class="movie-modal__meta"></div>

                    <div class="movie-modal__rating" id="modal-rating" aria-label="Audience rating">
                        <div class="movie-modal__stars" id="modal-stars" aria-hidden="true"></div>
                        <strong id="modal-rating-score">—</strong>
                        <span class="movie-modal__rating-out-of">/ 10</span>
                        <span class="movie-modal__rating-divider"></span>
                        <span id="modal-vote-count">No ratings yet</span>
                    </div>

                    <div id="modal-genres" class="movie-genres" aria-label="Movie genres"></div>
                    <p id="modal-overview" class="movie-modal__overview">Fetching movie information...</p>

                    <div class="movie-modal__actions">
                        <button id="modal-trailer-button"
                                class="movie-modal__button movie-modal__button--primary"
                                type="button" hidden>
                            <span class="movie-modal__play-icon" aria-hidden="true">▶</span>
                            Watch trailer
                        </button>
                        <a id="modal-tmdb-link" class="movie-modal__button movie-modal__button--secondary"
                           target="_blank" rel="noopener noreferrer" hidden>
                            View on TMDB <span aria-hidden="true">↗</span>
                        </a>
                    </div>
                </div>
                <div class="movie-modal__hero-bottom-line"></div>
            </div>

            <div class="movie-modal__body">
                <p id="modal-status" class="movie-modal__status" aria-live="polite"></p>

                <section class="movie-modal__section movie-modal__trailer-section" id="modal-video-section" hidden>
                    <div class="movie-modal__section-heading">
                        <div>
                            <p class="movie-modal__section-kicker">NOW SHOWING</p>
                            <h3>Watch the trailer</h3>
                        </div>
                        <span class="movie-modal__section-note" id="modal-trailer-label">Official trailer</span>
                    </div>
                    <div class="movie-modal__video-stage" id="modal-video-stage">
                        <div class="movie-modal__video-art" id="modal-video-art">
                            <div class="movie-modal__video-art-shade"></div>
                            <button class="movie-modal__video-play" id="modal-video-play" type="button"
                                    aria-label="Play movie trailer">
                                <span aria-hidden="true">▶</span>
                            </button>
                            <div class="movie-modal__video-caption">
                                <span class="movie-modal__video-live-dot"></span>
                                <span id="modal-video-caption-title">Official trailer</span>
                            </div>
                        </div>
                        <div class="movie-modal__video" id="modal-video" hidden></div>
                    </div>
                </section>

                <section class="movie-modal__section">
                    <div class="movie-modal__section-heading">
                        <div>
                            <p class="movie-modal__section-kicker">THE DETAILS</p>
                            <h3>About this movie</h3>
                        </div>
                    </div>
                    <div class="movie-modal__facts" id="modal-facts"></div>
                </section>

                <section class="movie-modal__section" id="modal-cast-section" hidden>
                    <div class="movie-modal__section-heading">
                        <div>
                            <p class="movie-modal__section-kicker">ON SCREEN</p>
                            <h3>Cast & crew</h3>
                        </div>
                    </div>
                    <div class="movie-modal__director" id="modal-director" hidden></div>
                    <div class="movie-modal__cast" id="modal-cast"></div>
                </section>

                <section class="movie-modal__section" id="modal-companies-section" hidden>
                    <div class="movie-modal__section-heading">
                        <div>
                            <p class="movie-modal__section-kicker">BEHIND THE FILM</p>
                            <h3>Production</h3>
                        </div>
                    </div>
                    <div class="movie-modal__companies" id="modal-companies"></div>
                </section>

                <section class="movie-modal__section" id="modal-images-section" hidden>
                    <div class="movie-modal__section-heading">
                        <div>
                            <p class="movie-modal__section-kicker">A CLOSER LOOK</p>
                            <h3>Movie gallery</h3>
                        </div>
                        <span class="movie-modal__section-note">Swipe to explore</span>
                    </div>
                    <div class="movie-modal__images" id="modal-images"></div>
                </section>
            </div>
        </section>
    </div>
</template>
